# Local LiveKit dev server for the Collaboration test suite only
# (scripts/collab-test-server.sh). Listens on this machine; its key is a
# throwaway test value, and its webhook reaches the local test Worker.
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
keys:
  devkey: secret-for-local-livekit-dev-server-only
webhook:
  api_key: devkey
  urls:
    - http://localhost:8788/api/meetings/webhook
logging:
  level: warn
